name: MASTER WATCH 2030 - Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle ausführbar machen
        run: chmod +x gradlew

      - name: Android APK bauen
        run: ./gradlew assembleDebug

      - name: APK als Ergebnis speichern
        uses: actions/upload-artifact@v4
        with:
          name: master-watch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
